    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            overflow: hidden;
        }
        #header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 12px 20px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #header h1 {
            font-size: 18px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #stats {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: #94a3b8;
        }
        #stats span {
            background: rgba(255,255,255,0.05);
            padding: 4px 10px;
            border-radius: 12px;
        }
        #search {
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: #e2e8f0;
            font-size: 13px;
            width: 200px;
            outline: none;
        }
        #search:focus {
            border-color: #60a5fa;
        }
        #graph {
            width: 100vw;
            height: 100vh;
        }
        .node {
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .node circle {
            stroke: rgba(255,255,255,0.2);
            stroke-width: 1.5px;
        }
        .node:hover circle {
            stroke: #fff;
            stroke-width: 3px;
            filter: brightness(1.3);
        }
        .node text {
            font-size: 10px;
            fill: #cbd5e1;
            pointer-events: none;
            text-anchor: middle;
            dominant-baseline: middle;
        }
        .node.entity text {
            font-weight: bold;
            font-size: 11px;
        }
        .link {
            stroke: rgba(255,255,255,0.08);
            stroke-width: 1;
        }
        .link.mentions { stroke: rgba(96, 165, 250, 0.15); }
        .link.same_date { stroke: rgba(16, 185, 129, 0.15); stroke-dasharray: 4 2; }
        .link.same_category { stroke: rgba(236, 72, 153, 0.15); stroke-dasharray: 2 2; }
        .link.co_occurrence { stroke: rgba(167, 139, 250, 0.2); stroke-width: 2; }
        
        #tooltip {
            position: fixed;
            padding: 12px 16px;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            font-size: 13px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            max-width: 320px;
            z-index: 200;
        }
        #tooltip .tt-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        #tooltip .tt-meta {
            color: #94a3b8;
            font-size: 11px;
            line-height: 1.6;
        }
        #tooltip .tt-type {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            margin-bottom: 6px;
        }
        
        #legend {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 14px 18px;
            font-size: 11px;
            z-index: 100;
        }
        #legend h3 {
            font-size: 12px;
            margin-bottom: 8px;
            color: #94a3b8;
        }
        #legend .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }
        #legend .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        
        #controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 8px;
            z-index: 100;
        }
        #controls button {
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            color: #e2e8f0;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        #controls button:hover {
            background: rgba(30, 41, 59, 0.95);
            border-color: #60a5fa;
        }
        
        .dimmed { opacity: 0.1; }
    </style>
</head>

        const matchedIds = new Set();
        nodes.forEach(n => {
            const searchable = [
                repoLabel(n),
                repoFullName(n),
                n.entity_type,
                n.category,
                n.description,
                n.language,
                n.visibility,
            ].filter(Boolean).join(" ").toLowerCase();
            if (searchable.includes(query)) {
                matchedIds.add(n.id);
            }
        });
        
        const connectedIds = new Set(matchedIds);
        links.forEach(l => {
            const sId = typeof l.source === "object" ? l.source.id : l.source;
            const tId = typeof l.target === "object" ? l.target.id : l.target;
            if (matchedIds.has(sId)) connectedIds.add(tId);
            if (matchedIds.has(tId)) connectedIds.add(sId);
        });
        
        node.classed("dimmed", n => !connectedIds.has(n.id));
        link.classed("dimmed", l => {
            const sId = typeof l.source === "object" ? l.source.id : l.source;
            const tId = typeof l.target === "object" ? l.target.id : l.target;
            return !matchedIds.has(sId) && !matchedIds.has(tId);
        });
    });
    
    // 라벨 토글
    let labelsVisible = true;
    function toggleLabels() {
        labelsVisible = !labelsVisible;
        node.select("text").style("display", labelsVisible ? "block" : "none");
    }
    
    // 시뮬레이션 틱
    simulation.on("tick", () => {
        link
            .attr("x1", d => d.source.x)
            .attr("y1", d => d.source.y)
            .attr("x2", d => d.target.x)
            .attr("y2", d => d.target.y);
        
        node.attr("transform", d => `translate(${d.x},${d.y})`);
    });
    
    // 드래그
    function dragstarted(event) { simulation.alphaTarget(0.3).restart(); }
    function dragged(event, d) { d.fx = event.x; d.fy = event.y; }
    function dragended(event) { simulation.alphaTarget(0); d.fx = null; d.fy = null; }
    
    // 윈도우 리사이즈
    window.addEventListener("resize", () => {
        const w = window.innerWidth, h = window.innerHeight;
        svg.attr("width", w).attr("height", h);
        simulation.force("center", d3.forceCenter(w / 2, h / 2));
        simulation.alpha(0.3).restart();
    });
    </script>
</body>
</html>
